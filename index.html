<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOJOUP大富豪 - 地产与基金</title>
<style>
  :root {
    --bg-deep: #0a0e1a;
    --bg-panel: #111827;
    --bg-card: #1a2234;
    --bg-cell: #1e293b;
    --border: #2d3a52;
    --gold: #f5c542;
    --gold-dim: #c9a227;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
    --purple: #a855f7;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --text-muted: #64748b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== 开始界面 ===== */
  #start-screen {
    position: fixed; inset: 0; overflow-y: auto;
    background: radial-gradient(ellipse at center, #1a2744 0%, var(--bg-deep) 70%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 1000;
  }
  #start-screen h1 {
    font-size: 2.15rem; font-weight: 900;
    background: linear-gradient(135deg, var(--gold), #fde68a);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.25rem;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }
  #start-screen .subtitle {
    color: var(--text-dim); font-size: 0.95rem;
    margin-bottom: 0.9rem; letter-spacing: 0.3em;
  }
  .player-setup {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 0.75rem 1.3rem;
    margin-bottom: 0.85rem;
  }
  .player-setup h3 {
    color: var(--gold); margin-bottom: 0.35rem;
    font-size: 0.85rem; letter-spacing: 0.1em;
  }
  .player-count-row {
    display: flex; gap: 0.6rem; margin-bottom: 0.5rem;
  }
  .count-btn {
    width: 40px; height: 40px;
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: 12px;
    color: var(--text); font-size: 1.05rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
  }
  .count-btn:hover { border-color: var(--gold-dim); }
  .count-btn.active {
    border-color: var(--gold);
    background: rgba(245,197,66,0.15);
    color: var(--gold);
  }
  .ip-grid {
    position: relative;
    width: 380px;
    height: 316px;
    margin: 0 auto 0.6rem;
  }
  .ip-card {
    position: absolute;
    left: 50%;
    width: 100px;
    margin-left: -50px;
    padding: 0.35rem 0.2rem;
    text-align: center;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .ip-card.pos-top-left     { top: 0;     left: calc(50% - 60px); }
  .ip-card.pos-top-right    { top: 0;     left: calc(50% + 60px); }
  .ip-card.pos-mid-left     { top: 104px; left: calc(50% - 120px); }
  .ip-card.pos-center       { top: 104px; left: 50%; }
  .ip-card.pos-mid-right    { top: 104px; left: calc(50% + 120px); }
  .ip-card.pos-bottom-left  { top: 208px; left: calc(50% - 60px); }
  .ip-card.pos-bottom-right { top: 208px; left: calc(50% + 60px); }
  .ip-card:hover .ip-avatar { transform: scale(1.06); }
  .ip-card.active .ip-avatar {
    box-shadow: 0 0 0 3px var(--gold), 0 0 18px rgba(245,197,66,0.55);
  }
  .ip-card.active .ip-name { color: var(--gold); }
  .ip-card .ip-avatar {
    width: 58px; height: 58px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 0.2rem;
    display: block;
    border: 2px solid rgba(255,255,255,0.18);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .ip-card .ip-name {
    font-weight: 700; font-size: 0.72rem; color: var(--text);
  }
  .ip-card .ip-tag {
    font-size: 0.52rem; color: var(--text-muted); margin-top: 0.05rem;
  }
  .fund-pick-list {
    display: flex; flex-direction: column; gap: 0.6rem;
  }
  .fund-pick-item {
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 0.75rem 1rem;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; transition: all 0.2s;
  }
  .fund-pick-item:hover { border-color: var(--gold-dim); transform: translateY(-1px); }
  .fund-pick-item .fp-name { font-weight: 700; }
  .fund-pick-item .fp-price { font-size: 0.8rem; color: var(--text-muted); }
  .player-names { display: flex; flex-direction: column; gap: 0.6rem; }
  .name-row {
    display: flex; align-items: center; gap: 0.75rem;
  }
  .name-row .dot {
    width: 14px; height: 14px; border-radius: 50%;
    flex-shrink: 0;
  }
  .name-row input {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.5rem 0.75rem;
    color: var(--text); font-size: 0.95rem;
    width: 150px; outline: none;
  }
  .name-row input:focus { border-color: var(--gold); }
  .type-toggle {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.45rem 0.9rem;
    color: var(--text-dim); font-size: 0.8rem; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
    letter-spacing: 0.05em;
    min-width: 56px;
    flex-shrink: 0;
  }
  .type-toggle:hover { transform: translateY(-1px); }
  .type-toggle.human {
    border-color: rgba(59,130,246,0.5);
    color: var(--blue);
    background: rgba(59,130,246,0.12);
  }
  .type-toggle.ai {
    border-color: rgba(168,85,247,0.5);
    color: var(--purple);
    background: rgba(168,85,247,0.12);
  }
  .ai-tag {
    display: inline-block;
    font-size: 0.55rem; font-weight: 700;
    color: var(--purple);
    border: 1px solid rgba(168,85,247,0.4);
    background: rgba(168,85,247,0.12);
    border-radius: 4px;
    padding: 0 0.25rem;
    margin-left: 0.3rem;
    vertical-align: middle;
  }
  .bankrupt-order {
    display: inline-block;
    font-size: 0.55rem; font-weight: 700;
    color: var(--red);
    border: 1px solid rgba(239,68,68,0.4);
    background: rgba(239,68,68,0.10);
    border-radius: 4px;
    padding: 0 0.25rem;
    margin-left: 0.3rem;
    vertical-align: middle;
  }
  .start-btn {
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    color: #1a1a1a; font-size: 1.05rem; font-weight: 800;
    padding: 0.58rem 2.2rem; border: none; border-radius: 12px;
    cursor: pointer; letter-spacing: 0.15em;
    transition: transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(245,197,66,0.3);
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(245,197,66,0.45); }
  .start-btn:active { transform: translateY(0); }
  .start-actions {
    display: flex; gap: 0.8rem; align-items: center; justify-content: center;
    margin-bottom: 0.4rem;
  }
  .rules-open-btn {
    background: transparent;
    border: 2px solid var(--gold-dim);
    color: var(--gold);
    font-size: 1rem; font-weight: 700;
    padding: 0.58rem 1.3rem; border-radius: 12px;
    cursor: pointer; letter-spacing: 0.15em;
    transition: all 0.2s;
  }
  .rules-open-btn:hover { border-color: var(--gold); box-shadow: 0 4px 18px rgba(245,197,66,0.25); }
  .rules-modal-list {
    display: flex; flex-direction: column; gap: 0.7rem;
    max-height: 55vh; overflow-y: auto;
  }
  .rules-modal-item {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.65rem 0.9rem;
    text-align: left;
  }
  .rules-modal-item .rm-title {
    font-weight: 700; color: var(--gold); font-size: 0.85rem; margin-bottom: 0.25rem;
  }
  .rules-modal-item .rm-desc {
    font-size: 0.78rem; color: var(--text); line-height: 1.6;
  }


  /* ===== 游戏主界面 ===== */
  #game-screen {
    display: none;
    min-height: 100vh;
    padding: 0.75rem;
  }
  #game-screen.active { display: block; }

  .game-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(300px, 400px);
    gap: 1rem;
    max-width: 100%;
    margin: 0 auto;
  }

  /* 棋盘区域 */
  .board-wrapper {
    width: min(100%, calc(100dvh - 5rem));
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 0.6rem;
    margin: 0 auto;
    position: relative;
  }

  .board {
    container-type: inline-size;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(7, 1fr);
    gap: 0.38cqw;
    aspect-ratio: 1;
    max-width: 100%;
  }

  .cell {
    background: var(--bg-cell);
    border: 1px solid var(--border);
    border-radius: 6px;
    position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0.5cqw;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .cell.current {
    box-shadow: 0 0 0 2px var(--gold), 0 0 12px rgba(245,197,66,0.5);
    z-index: 2;
  }
  .cell .cell-name {
    font-size: 2cqw; font-weight: 600;
    text-align: center; line-height: 1.2;
    color: var(--text);
    word-break: break-all;
  }
  .cell .cell-price {
    font-size: 1.85cqw; color: var(--gold);
    margin-top: 0.25cqw;
  }
  .cell .cell-build {
    font-size: 1.7cqw; color: #4ade80;
    margin-top: 0.13cqw;
  }
  .cell .cell-icon {
    font-size: 3.6cqw; margin-bottom: 0.25cqw;
  }
  .cell .owner-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 0.6cqw;
  }
  .cell .street-bar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 0.75cqw;
  }
  .cell .street-bar.full {
    height: 1.4cqw;
    box-shadow: 0 0 8px rgba(255,255,255,0.35);
  }
  .cell .street-full {
    position: absolute; bottom: 6px; right: 1px;
    font-size: 1.45cqw; font-weight: 800;
    color: #1a1a1a; background: var(--gold);
    border-radius: 3px; padding: 0.1cqw 0.5cqw;
    letter-spacing: 0.02em;
  }
  .cell .houses {
    display: flex; gap: 1px; justify-content: center;
    margin-top: 3px;
  }
  .cell .house-dot {
    width: 0.75cqw; height: 0.75cqw; border-radius: 1px;
    background: var(--green);
  }
  .cell.corner {
    background: linear-gradient(135deg, #1e3a5f, #0f1f33);
  }
  .cell.special-card {
    background: linear-gradient(135deg, #3b1f5e, #1e0f33);
  }
  .cell.special-fortune {
    background: linear-gradient(135deg, #1f3d5e, #0f1f33);
    border: 1px solid rgba(168,85,247,0.55);
  }
  /* 玩家棋子 */
  .tokens {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    display: flex; flex-wrap: wrap;
    gap: 0.3cqw; justify-content: center;
    width: 80%;
    z-index: 3;
    pointer-events: none;
  }
  .token {
    width: 2.5cqw; height: 2.5cqw;
    border-radius: 50%;
    border: 0.3cqw solid rgba(255,255,255,0.8);
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    transition: all 0.3s ease;
  }

  /* 中央操作面板 */
  .center-panel {
    grid-column: 2 / 7;
    grid-row: 2 / 7;
    background: var(--bg-deep);
    border: 1px solid var(--border);
    border-radius: 1.25cqw;
    padding: 1.2cqw 1.5cqw;
    display: flex; flex-direction: column;
    overflow: hidden;
    position: relative;
    z-index: 5;
  }
  .center-panel h3 {
    font-size: 2.5cqw; color: var(--gold);
    letter-spacing: 0.15em; margin-bottom: 0.8cqw;
    text-align: center;
    flex-shrink: 0;
  }
  .price-index-display {
    text-align: center;
    font-size: 2.2cqw; font-weight: 700;
    color: #ffb74d;
    background: rgba(245,197,66,0.1);
    border: 1px solid rgba(245,197,66,0.28);
    border-radius: 6px;
    padding: 0.3cqw 0;
    margin-bottom: 0.8cqw;
    flex-shrink: 0;
  }
  .fund-list {
    flex: 1; overflow: visible;
    display: flex; flex-direction: column; gap: 0.6cqw;
    min-height: 0;
  }
  .fund-item {
    background: var(--bg-card);
    border-radius: 6px; padding: 0.7cqw 1.2cqw;
    border-left: 3px solid var(--border);
  }
  .center-fund-item {
    padding: 0.5cqw 1.1cqw;
  }
  .center-fund-item .fund-head { margin-bottom: 0; }
  .fund-item .fund-head {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 2px;
  }
  .fund-item .fund-name {
    font-size: 2.3cqw; font-weight: 600;
  }
  .fund-item .fund-name-row {
    display: flex; align-items: center; gap: 0.7cqw;
  }
  .fund-item .fund-price {
    font-size: 2.4cqw; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .fund-item .fund-change {
    font-size: 2cqw; font-weight: 600;
    margin-left: 0.6cqw;
  }
  .fund-item .fund-spark {
    height: 2.2cqw; margin-top: 0.25cqw;
  }
  .fund-item .fund-spark svg { width: 100%; height: 100%; }

  /* 股票异动状态：红卡 / 黑卡 / 平稳 */
  .fund-status {
    display: inline-block;
    font-size: 1.9cqw; font-weight: 800;
    padding: 0.1cqw 0.7cqw;
    border-radius: 3px;
    letter-spacing: 0.05em;
  }
  .fund-status.hong {
    background: #e11d48;
    color: #fff;
    box-shadow: 0 0 6px rgba(225,29,72,0.6);
  }
  .fund-status.hei {
    background: #18181b;
    color: #f4f4f5;
    border: 1px solid #52525b;
    box-shadow: 0 0 6px rgba(0,0,0,0.5);
  }
  .fund-status.flat {
    background: rgba(148,163,184,0.15);
    color: var(--text-dim);
  }

  /* 中央操作区 */
  .center-actions {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    padding-top: 1.1cqw;
    margin-top: 0.8cqw;
    display: flex; flex-direction: column; align-items: center; gap: 0.9cqw;
  }
  .center-actions .action-area {
    width: 100%;
  }
  .center-actions .roll-big {
    width: 100%;
    padding: 1.4cqw 2.2cqw;
    font-size: 3.1cqw;
  }
  .center-actions .action-row {
    display: flex; gap: 1cqw;
  }
  .center-actions .action-row .btn {
    flex: 1;
    padding: 1.2cqw 1.1cqw;
    font-size: 2.55cqw;
  }

  /* 超级地产 */
  .cell.super-property {
    background: linear-gradient(135deg, #4a3212, #241703);
    border-color: var(--gold-dim);
    box-shadow: inset 0 0 8px rgba(245,197,66,0.15);
  }
  .cell.super-property .cell-name { color: var(--gold); font-weight: 700; }
  .cell.super-property .super-tag {
    display: inline-block;
    font-size: 1.55cqw; font-weight: 800;
    color: #1a1a1a;
    background: var(--gold);
    border-radius: 3px;
    padding: 0.1cqw 0.6cqw;
    margin-top: 1px;
    letter-spacing: 0.05em;
  }

  /* 右侧信息面板 */
  .side-panel {
    display: flex; flex-direction: column; gap: 0.7rem;
  }

  .panel-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.8rem;
  }
  .panel-card h3 {
    font-size: 0.9rem; color: var(--gold);
    letter-spacing: 0.15em; margin-bottom: 0.75rem;
    text-transform: uppercase;
  }

  /* 当前玩家 */
  .current-player-card {
    border: 2px solid var(--gold);
    background: linear-gradient(135deg, rgba(245,197,66,0.08), var(--bg-panel));
  }
  .cp-header {
    display: flex; align-items: center; gap: 0.6rem;
    margin-bottom: 0.75rem;
  }
  .cp-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #fff; font-size: 1rem;
    overflow: hidden;
  }
  .cp-avatar img {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
  }
  .cp-info .cp-name {
    font-size: 1.05rem; font-weight: 700;
  }
  .cp-info .cp-turn {
    font-size: 0.85rem; color: var(--text-dim);
  }
  .cp-stats {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
  }
  .cp-stat {
    background: var(--bg-card);
    border-radius: 6px; padding: 0.4rem 0.6rem;
  }
  .cp-stat .label {
    font-size: 0.75rem; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .cp-stat .value {
    font-size: 1.1rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .cp-stat .value.gold { color: var(--gold); }
  .cp-stat .value.green { color: var(--green); }

  /* 玩家列表 */
  .player-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .player-row {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.4rem 0.6rem;
    background: var(--bg-card);
    border-radius: 6px;
    border-left: 3px solid transparent;
  }
  .player-row.active { border-left-color: var(--gold); }
  .player-row.bankrupt { opacity: 0.4; text-decoration: line-through; }
  .player-row .pr-dot {
    width: 10px; height: 10px; border-radius: 50%;
    flex-shrink: 0;
  }
  .player-row .pr-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    object-fit: cover; flex-shrink: 0;
  }
  .player-row .pr-name {
    flex: 1; font-size: 0.95rem; font-weight: 600;
  }
  .player-row .pr-money {
    font-size: 0.95rem; font-weight: 700;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
  }

  /* 操作按钮区 */
  .action-area {
    display: flex; flex-direction: column; gap: 0.5rem;
  }
  .btn {
    padding: 0.7rem 1rem;
    border: none; border-radius: 8px;
    font-size: 0.9rem; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
    letter-spacing: 0.05em;
  }
  .btn:disabled {
    opacity: 0.35; cursor: not-allowed;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    color: #1a1a1a;
  }
  .btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(245,197,66,0.3);
  }
  .btn-secondary {
    background: var(--bg-card);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover:not(:disabled) {
    border-color: var(--gold-dim);
  }
  .btn-danger {
    background: rgba(239,68,68,0.15);
    color: var(--red);
    border: 1px solid rgba(239,68,68,0.3);
  }
  .btn-danger:hover:not(:disabled) {
    background: rgba(239,68,68,0.25);
  }
  .btn-row {
    display: flex; gap: 0.5rem;
  }
  .btn-row .btn { flex: 1; }

  /* 骰子 */
  .dice-display {
    display: flex; justify-content: center; gap: 1.8cqw;
    margin-bottom: 1.7cqw;
  }
  .die {
    width: 7cqw; height: 7cqw;
    background: var(--bg-card);
    border: 0.25cqw solid var(--border);
    border-radius: 1.25cqw;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 0.85cqw;
    gap: 0.25cqw;
  }
  .die .pip {
    background: var(--gold);
    border-radius: 50%;
    width: 100%; height: 100%;
  }
  .die.rolling { animation: shake 0.1s infinite; }
  @keyframes shake {
    0%,100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }

  /* 日志 */
  .log-panel {
    max-height: 180px;
    overflow-y: auto;
  }
  .log-list {
    display: flex; flex-direction: column; gap: 0.3rem;
  }
  .log-entry {
    font-size: 0.85rem; line-height: 1.5;
    padding: 0.3rem 0.5rem;

// Fisher-Yates 洗牌
function shuffleArr(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 7x7 网格中24格的坐标映射（顺时针环形）
// 行0: 0-6, 行1-5: 左右两边, 行6: 18-12 (反向)
const GRID_POS = [];
(function buildGridPos() {
  // 上边: id 0-6 -> grid row 0, col 0-6
  for (let i = 0; i <= 6; i++) GRID_POS[i] = { row: 0, col: i };
  // 右边: id 7-11 -> grid col 6, row 1-5
  for (let i = 1; i <= 5; i++) GRID_POS[6 + i] = { row: i, col: 6 };
  // 右下角 id 12 -> row 6 col 6 (already covered? no, 12 is the corner)
  // 实际上 id 6 是右上角(row0,col6), id 12 是右下角(row6,col6)
  // 重新映射: 上边 0-5 (6格), 右上角6, 右边7-11(5格), 右下角12, 下边13-17(5格反向), 左下角18, 左边19-23(5格反向)
  GRID_POS.length = 0;
  // 上边: 0,1,2,3,4,5 -> row0 col0-5
  for (let i = 0; i <= 5; i++) GRID_POS[i] = { row: 0, col: i };
  // 右上角: 6 -> row0 col6
  GRID_POS[6] = { row: 0, col: 6 };
  // 右边: 7,8,9,10,11 -> row1-5 col6
  for (let i = 0; i < 5; i++) GRID_POS[7 + i] = { row: 1 + i, col: 6 };
  // 右下角: 12 -> row6 col6
  GRID_POS[12] = { row: 6, col: 6 };
  // 下边: 13,14,15,16,17 -> row6 col5-1 (反向)
  for (let i = 0; i < 5; i++) GRID_POS[13 + i] = { row: 6, col: 5 - i };
  // 左下角: 18 -> row6 col0
  GRID_POS[18] = { row: 6, col: 0 };
  // 左边: 19,20,21,22,23 -> row5-1 col0 (反向)
  for (let i = 0; i < 5; i++) GRID_POS[19 + i] = { row: 5 - i, col: 0 };
})();

    effect: (g, p) => {
      const alive = g.players.filter(op => !op.bankrupt);
      if (alive.length < 2) { addLog('场上不足两人，均贫卡无效。', 'info', p.name); return false; }
      let richest = alive[0];
      alive.forEach(op => { if (op.cash > richest.cash) richest = op; });
      const share = Math.floor(richest.cash / 2);
      if (share < alive.length) { addLog('最富玩家现金太少，均贫卡无效。', 'info', p.name); return false; }
      richest.cash -= share;
      const others = alive.filter(op => op !== richest);
      const each = Math.floor(share / others.length);
      others.forEach(op => { op.cash += each; });
      addLog(`${richest.name} 的一半现金 ¥${fmt(share)} 被分给其他玩家！`, 'good', p.name);
      return true;
    } },
  { title: '均富卡', text: '共同富裕！所有玩家现金拉平为平均值。', type: 'good',
    effect: (g, p) => {
      const alive = g.players.filter(op => !op.bankrupt);
      if (alive.length < 2) { addLog('场上不足两人，均富卡无效。', 'info', p.name); return false; }
      const total = alive.reduce((s, op) => s + op.cash, 0);
      const each = Math.floor(total / alive.length);
      alive.forEach(op => { op.cash = each; });
      addLog(`所有玩家现金平均为 ¥${fmt(each)}！`, 'good', p.name);
      return true;
    } },
  { title: '怪兽卡', text: '召唤怪兽！摧毁对手一处房产的所有建筑。', type: 'good',
    effect: (g, p) => {
      const targets = [];
      g.players.forEach(op => {
        if (op === p || op.bankrupt) return;
        op.properties.forEach(pid => {
          const c = g.board[pid];
          if (c && c.type === 'property' && c.houses > 0) targets.push(c);
        });
      });
      if (targets.length === 0) { addLog('对手没有可破坏的房屋，怪兽卡无效。', 'info', p.name); return false; }
      targets.sort((a, b) => (b.houses - a.houses) || (b.price - a.price));
      const t = targets[0];
      const cnt = t.houses;
      t.houses = 0;
      addLog(`怪兽摧毁了【${t.name}】上的 ${cnt} 栋建筑！`, 'bad', p.name);
      return true;
    } },
  { title: '购地卡', text: '直接占有当前脚下的土地！', type: 'good',
    effect: (g, p) => {
      const cell = g.board[p.position];
      if (!cell || cell.type !== 'property') { addLog('当前不在可占用的土地上，购地卡无效。', 'info', p.name); return false; }
      if (cell.owner === p.id) { addLog('脚下土地已是你的，购地卡无效。', 'info', p.name); return false; }
      if (cell.owner !== null) {
        const old = g.players[cell.owner];
        if (old) old.properties = old.properties.filter(pid => pid !== cell.id);
        addLog(`${p.name} 用购地卡夺取了【${cell.name}】！`, 'good', p.name);
      } else {
        addLog(`${p.name} 用购地卡免费占有了【${cell.name}】！`, 'good', p.name);
      }
      cell.owner = p.id;
      p.properties.push(cell.id);
      return true;
    } },
];

const game = {

// ---------- 工具函数 ----------
function $(id) { return document.getElementById(id); }
function fmt(n) { return Math.round(n).toLocaleString('zh-CN'); }
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

function addLog(text, type = 'info', playerName = '') {
  game.logs.unshift({ text, type, playerName, turn: game.turn });
  if (game.logs.length > 50) game.logs.pop();
  renderLog();
}

// ---------- 初始化 ----------
function initGame(playerNames, playerTypes, playerColors, playerAvatars) {
  game.players = playerNames.map((name, i) => ({
    id: i,
    name: name || `玩家${i + 1}`,
    color: (playerColors && playerColors[i]) || PLAYER_COLORS[i],
    initial: PLAYER_INITIALS[i],
    avatar: (playerAvatars && playerAvatars[i]) || null,
    isAI: !!(playerTypes && playerTypes[i] === 'ai'),
    cash: STARTING_MONEY,
    position: 0,
    properties: [],
    funds: { nasdaq: 0, sse: 0, cyb: 0, btc: 0 },
    bankrupt: false,
    bankruptOrder: -1, // -1=未破产；>=0 为破产顺序
    cards: [],
    cardAddedTurn: -1,
    remoteDice: false,
  }));

  // 每位玩家初始获得 2 张「遥控骰子」卡
  const remoteCard = CARD_EVENTS.find(c => c.title === '遥控骰子') || CARD_EVENTS[0];
  game.players.forEach(pl => {
    pl.cards = [remoteCard, remoteCard];
  });

  // 每局随机洗牌全球地名池，各地块初始价格在基准 ±15% 内浮动
  const globalNames = shuffleArr([...GLOBAL_NAMES]);
  game.board = BOARD_DEFS.map(def => {
    const b = { ...def, owner: null, houses: 0, mortgaged: false };
    if (def.type === 'property') {
      b.name = globalNames.shift() || def.name;
      const fluc = 0.85 + Math.random() * 0.3; // 0.85 ~ 1.15
      b.price = Math.max(100, Math.round(def.price * fluc / 50) * 50);
      b.rent = Math.max(10, Math.round(def.rent * b.price / def.price / 10) * 10);
      b.houseCost = Math.max(100, Math.round(def.houseCost * b.price / def.price / 50) * 50);
    }
    return b;
  });

  game.funds = FUNDS.map(f => ({
    ...f,
    price: f.basePrice,
    history: [f.basePrice],
    card: null,
    cardTurns: 0,
    guard: null,
  }));

  game.currentPlayerIndex = 0;
  game.turn = 1;
  game.phase = 'idle';
  game.dice = [1, 1];
  game.cardMoveDepth = 0;
  game.logs = [];

  $('start-screen').style.display = 'none';
  $('game-screen').classList.add('active');

  const aiCount = game.players.filter(p => p.isAI).length;
  addLog(`游戏开始！${aiCount > 0 ? `${aiCount} 个 AI 已加入对战。` : ''}每位玩家初始资金 ${fmt(STARTING_MONEY)} 元。`, 'info');
  renderAll();

  // 如果第一个玩家是 AI，自动开始回合
  scheduleAITurn();
}

// ---------- 渲染 ----------
function maybeSkipBankruptCurrent() {
  const p = game.players[game.currentPlayerIndex];
  if (!p || !p.bankrupt) return false;
  if (game.phase === 'ended') return false;
  if ($('modal-overlay').classList.contains('active')) return false;
  const alive = game.players.filter(pl => !pl.bankrupt);
  if (alive.length <= 1) { endGame(alive[0]); return true; }
  // 推进到下一个活着的玩家（跳过破产者；不更新基金价，避免红黑卡回合被提前扣减）
  let nextIdx = (game.currentPlayerIndex + 1) % game.players.length;
  let attempts = 0;
  while (game.players[nextIdx].bankrupt && attempts < game.players.length) {
    nextIdx = (nextIdx + 1) % game.players.length;
    attempts++;
  }
  if (nextIdx <= game.currentPlayerIndex) game.turn++;
  game.currentPlayerIndex = nextIdx;
  game.phase = 'idle';
  addLog(`💀 破产玩家被跳过，轮到 ${game.players[nextIdx].name}。`, 'info', game.players[nextIdx].name);
  renderAll();
  scheduleAITurn();
  return true;
}

function renderAll() {
  maybeSkipBankruptCurrent();
  renderBoard();
  renderCurrentPlayer();
  renderPlayerList();
  renderFunds();
  renderActions();
  renderDice();
  // 更新物价系数显示
  const pidx = $('price-index-display');
  if (pidx) pidx.textContent = `物价 ×${getPriceIndex().toFixed(2)}`;
}

function renderBoard() {
  const board = $('board');
  board.innerHTML = '';

  // 创建49个格子(7x7)
  const cells = {};
  for (let r = 0; r < 7; r++) {
    for (let c = 0; c < 7; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.gridRow = (r + 1);
      cell.style.gridColumn = (c + 1);
      cell.dataset.row = r;
      cell.dataset.col = c;
      cells[`${r}-${c}`] = cell;
      board.appendChild(cell);
    }
  }

  // 中央操作面板（基金行情 + 骰子 + 操作按钮）
  const center = document.createElement('div');
  center.className = 'center-panel';
  center.innerHTML = `
    <h3>基 金 异 动 行 情</h3>
    <div class="price-index-display" id="price-index-display">物价 ×1.00</div>
    <div class="fund-list" id="center-fund-list"></div>
    <div class="center-actions">
      <div class="dice-display" id="dice-display">
        <div class="die" id="die1"></div>
        <div class="die" id="die2"></div>
      </div>
      <div class="action-area">
        <button class="btn btn-primary roll-big" id="roll-btn">掷 骰 子</button>
        <div class="action-row">
          <button class="btn btn-secondary" id="card-btn" style="display:none;">卡片</button>
          <button class="btn btn-secondary" id="fund-btn" style="display:none;">基金交易</button>
          <button class="btn btn-secondary" id="game-rules-btn">规则</button>
        </div>
        <div class="action-row">
          <button class="btn btn-secondary" id="end-turn-btn" style="display:none;">结束回合</button>
        </div>
      </div>
    </div>
  `;
  center.style.gridRow = '2 / 7';
  center.style.gridColumn = '2 / 7';
  board.appendChild(center);
  bindCenterControls();

  // 放置24个游戏格
  game.board.forEach((cellData, idx) => {
    const pos = GRID_POS[idx];
    const cell = cells[`${pos.row}-${pos.col}`];
    cell.dataset.cellId = idx;

    // 类型样式
    if (cellData.type === 'start') cell.classList.add('corner');
    else if (cellData.type === 'fortune') cell.classList.add('corner', 'special-fortune');
    else if (cellData.type === 'card') cell.classList.add('special-card');
    if (cellData.super) cell.classList.add('super-property');

    // 所有者颜色条
    if (cellData.owner !== null && cellData.type === 'property') {
      const owner = game.players[cellData.owner];
      const bar = document.createElement('div');
      bar.className = 'owner-bar';
      bar.style.background = owner.color;
      cell.appendChild(bar);
    }

    // 内容
    if (cellData.type === 'property') {
      const street = STREET_OF[idx];
      const ownsFull = street && cellData.owner !== null && ownsWholeStreet(cellData.owner, street);
      // 地价与盖房成本实时随物价系数变化，与购买/盖房扣款保持一致
      const pIdx = getPriceIndex();
      const curPrice = Math.max(1, Math.round(cellData.price * pIdx));
      const curHouse = Math.max(1, Math.round(cellData.houseCost * pIdx));
      cell.innerHTML += `
        <div class="cell-name">${cellData.name}</div>
        <div class="cell-price">¥${fmt(curPrice)}</div>
        <div class="cell-build">盖 ¥${fmt(curHouse)}</div>
        ${cellData.super ? '<div class="super-tag">超级地产</div>' : ''}
        ${cellData.houses > 0 ? `<div class="houses">${'<div class="house-dot"></div>'.repeat(cellData.houses)}</div>` : ''}
        ${ownsFull ? '<div class="street-full">全街</div>' : ''}
      `;
      if (street) {
        const sbar = document.createElement('div');
        sbar.className = 'street-bar' + (ownsFull ? ' full' : '');
        sbar.style.background = street.color;
        cell.appendChild(sbar);
      }
    } else {
      const iconText = cellData.icon || cellData.name;
      cell.innerHTML += `
        <div class="cell-icon" style="font-size:2.6cqw;font-weight:800;letter-spacing:0.05em;">${iconText}</div>
        <div class="cell-name" style="font-size:2cqw;">${cellData.name}</div>
      `;
    }

    // 当前玩家标记
    const tokensHere = game.players.filter(p => p.position === idx && !p.bankrupt);
    if (tokensHere.length > 0) {
      const tokensDiv = document.createElement('div');
      tokensDiv.className = 'tokens';
      tokensHere.forEach(p => {
        const token = document.createElement('div');
        token.className = 'token';
        token.style.background = p.color;
        token.title = p.name;
        tokensDiv.appendChild(token);
      });
      cell.appendChild(tokensDiv);
      if (tokensHere.some(p => p.id === game.currentPlayerIndex)) {
        cell.classList.add('current');
      }
    }
  });

  renderCenterFunds();
}

function renderCenterFunds() {
  const list = $('center-fund-list');
  if (!list) return;
  list.innerHTML = '';
  game.funds.forEach(f => {
    const prev = f.history.length > 1 ? f.history[f.history.length - 2] : f.price;
    const change = ((f.price - prev) / prev * 100);
    const changeColor = change >= 0 ? 'var(--green)' : 'var(--red)';
    const changeSign = change >= 0 ? '+' : '';

    // 异动状态：红卡(持续大涨) / 黑卡(持续大跌) / 平稳
    let statusHtml;
    if (f.guard === 'up') {
      statusHtml = '<span class="fund-status hong">救市 +20%</span>';
    } else if (f.guard === 'down') {
      statusHtml = '<span class="fund-status hei">回调 -20%</span>';
    } else if (f.card === 'hong') {
      statusHtml = `<span class="fund-status hong">红卡 ${f.cardTurns}/5</span>`;
    } else if (f.card === 'hei') {
      statusHtml = `<span class="fund-status hei">黑卡 ${f.cardTurns}/5</span>`;
    } else {
      statusHtml = '<span class="fund-status flat">平稳</span>';
    }

    const item = document.createElement('div');
    item.className = 'fund-item center-fund-item';
    item.style.borderLeftColor = f.color;
    item.innerHTML = `
      <div class="fund-head">
        <span class="fund-name-row">
          <span class="fund-name" style="color:${f.color}">${f.short}</span>
          ${statusHtml}
        </span>
        <span class="fund-price">${f.price.toFixed(1)}<span class="fund-change" style="color:${changeColor}"> ${changeSign}${change.toFixed(2)}%</span></span>
      </div>
    `;
    list.appendChild(item);
  });
}

function renderCurrentPlayer() {

function renderPlayerList() {
  const list = $('player-list');
  list.innerHTML = '';
  const sorted = [...game.players].sort((a, b) => calcTotalAssets(b) - calcTotalAssets(a));
  sorted.forEach(p => {
    const row = document.createElement('div');

function renderActions() {
  const rollBtn = $('roll-btn');
  const fundBtn = $('fund-btn');
  const endBtn = $('end-turn-btn');
  const cardBtn = $('card-btn');
  const grBtn = $('game-rules-btn');
  const p = game.players[game.currentPlayerIndex];
  const isAI = p.isAI;

  // AI 回合隐藏规则键，避免弹窗中断 AI 流程；人类回合恢复显示
  if (grBtn) grBtn.style.display = isAI ? 'none' : 'inline-block';

  if (game.phase === 'idle') {
    // 每回合开始：掷骰 + 可选基金交易 + 可选使用卡片（卡片只在卡片屋购买）
    rollBtn.style.display = 'block';
    rollBtn.disabled = isAI;
    rollBtn.textContent = isAI ? 'AI 行动中...' : '掷 骰 子';
    fundBtn.style.display = 'block';
    fundBtn.textContent = '基金交易';
    fundBtn.disabled = isAI;
    cardBtn.style.display = 'block';
    cardBtn.textContent = `卡片 (${p.cards.length})`;
    cardBtn.disabled = isAI || p.cards.length === 0;
    endBtn.style.display = 'none';
  } else if (game.phase === 'action') {
    rollBtn.style.display = 'none';
    fundBtn.style.display = 'none';
    cardBtn.style.display = 'none';
    // 已删掉“结束回合”按钮：仅双数时显示“再掷一次”，其余情况落地结算后自动结束回合
    if (game.doublesPending && !isAI) {
      endBtn.style.display = 'block';
      endBtn.disabled = false;
      endBtn.textContent = '再掷一次（双数）';
    } else {
      endBtn.style.display = 'none';
    }
  } else {
    rollBtn.style.display = 'none';
    fundBtn.style.display = 'none';
    cardBtn.style.display = 'none';
    endBtn.style.display = 'none';
  }
}

function renderDice() {
  renderDie('die1', game.dice[0]);
  renderDie('die2', game.dice[1]);
}

function renderDie(id, value) {
  const die = $(id);
  die.innerHTML = '';
  // 3x3 grid, pips positions for 1-6
  const pipMap = {
    1: [4],
    2: [0, 8],
    3: [0, 4, 8],
    4: [0, 2, 6, 8],
    5: [0, 2, 4, 6, 8],
    6: [0, 2, 3, 5, 6, 8],
  };
  const pips = pipMap[value] || [];
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    if (pips.includes(i)) cell.className = 'pip';
    die.appendChild(cell);
  }
}

function renderLog() {
  const list = $('log-list');
  list.innerHTML = '';
  game.logs.slice(0, 20).forEach(log => {
    const entry = document.createElement('div');
    entry.className = 'log-entry ' + log.type;
    const name = log.playerName ? `<span class="log-player" style="color:${getPlayerColorByName(log.playerName)}">${log.playerName}</span> ` : '';
    entry.innerHTML = name + log.text;
    list.appendChild(entry);
  });
}

function getPlayerColorByName(name) {
  const p = game.players.find(p => p.name === name);
  return p ? p.color : 'var(--text-dim)';
}

// ---------- 资产计算 ----------
function calcTotalAssets(p) {
  let total = p.cash;
  // 土地价值
  p.properties.forEach(pid => {
    const cell = game.board[pid];
    total += cell.price;
    total += cell.houses * cell.houseCost * 0.6; // 房子按60%折算
  });
  // 基金市值
  total += calcFundValue(p);
  return total;
}

// ---------- 物价系数 ----------
// 随全体玩家总资产增长而上涨：总资产每翻一倍，物价 +50%（保底 1，封顶 5）
function getTotalAssets() {
  return game.players.filter(p => !p.bankrupt).reduce((s, p) => s + calcTotalAssets(p), 0);
}
function getPriceIndex() {
  const base = STARTING_MONEY * game.players.length;
  const total = getTotalAssets();
  // 物价与总资产成比例线性上涨、无上限：
  // 总资产每超出基准 100%，物价指数再涨 1.5 倍
  let idx = 1 + Math.max(0, total - base) / base * 1.5;
  idx = Math.max(1, idx);
  return Math.round(idx * 100) / 100;
}
function shopPrice(s) {
  // 卡片商店价格随物价系数上涨
  return Math.max(1, Math.round(s.price * getPriceIndex()));
}

function calcFundValue(p) {
  let total = 0;
  game.funds.forEach(f => {
    total += (p.funds[f.id] || 0) * f.price;
  });
  return total;
}

function ownsWholeStreet(ownerId, street) {
  return street.cells.every(cid => {
    const c = game.board[cid];
    return c.type === 'property' && c.owner === ownerId && !c.mortgaged;
  });
}

function calcRent(cell) {
  let rent = cell.rent;
  if (cell.houses > 0) {
    // 房子倍数: 1栋=2x, 2栋=4x, 3栋=7x, 4栋=12x
    const multipliers = [1, 2, 4, 7, 12];
    rent = cell.rent * multipliers[cell.houses];
  }
  // 整条街道都归同一玩家所有：租金翻倍
  const street = STREET_OF[cell.id];
  if (street && cell.owner !== null && ownsWholeStreet(cell.owner, street)) {
    rent *= 2;
  }
  // 物价系数：随全体玩家总资产上涨，高物价下开销更大
  rent *= getPriceIndex();
  return Math.max(1, Math.round(rent / 10) * 10);
}

// ---------- 基金价格更新（含红卡/黑卡状态机） ----------
const CARD_TURNS = 5;   // 红卡/黑卡持续回合数
const CARD_PCT = 0.20;  // 红卡/黑卡每回合固定涨跌幅

function normalChangeFor(f) {
  switch (f.behavior) {
    case 'steady_up':
      // 满分躺赢基金: 稳定上涨, 每回合 +0.3% ~ +1.5%, 偶尔小跌
      let c = rand(0.003, 0.015);
      if (Math.random() < 0.1) c = rand(-0.008, 0.002);
      return c;
    case 'volatile':
      // 考试蹦极基金: 大起大落, -6% ~ +8%
      return rand(-0.06, 0.08);
    case 'random':
      // 锦鲤盲盒基金: 随机, -3% ~ +4%
      return rand(-0.03, 0.04);
    case 'random_high':
      // 顶流塌房基金: 高波动随机, -8% ~ +10%
      return rand(-0.08, 0.10);
    default:
      return rand(-0.02, 0.03);
  }
}

function maybeTriggerCard(f) {
  // 每回合按基金行为概率触发红卡/黑卡（持续 CARD_TURNS 回合）
  const probs = {
    steady_up:    { hong: 0.15, hei: 0.04 },  // 满分躺赢基金: 更容易红卡，几乎不黑卡
    volatile:     { hong: 0.15, hei: 0.15 },  // 考试蹦极基金: 大起大落，红黑均等
    random:       { hong: 0.08, hei: 0.08 },  // 锦鲤盲盒基金: 中概率
    random_high:  { hong: 0.12, hei: 0.12 },  // 顶流塌房基金: 较高波动
  };
  const p = probs[f.behavior] || { hong: 0.08, hei: 0.08 };
  if (Math.random() < p.hong) {
    f.card = 'hong';
    f.cardTurns = CARD_TURNS;
    addLog(`${f.name} 触发【红卡】！接下来 ${CARD_TURNS} 回合每回合 +20%`, 'good');
    return true;
  }
  if (Math.random() < p.hei) {
    f.card = 'hei';
    f.cardTurns = CARD_TURNS;
    addLog(`${f.name} 触发【黑卡】！接下来 ${CARD_TURNS} 回合每回合 -20%`, 'bad');
    return true;
  }
  return false;
}

function triggerFundCard(fundId, card) {
  // 强制触发某基金的红卡/黑卡（卡片事件用）
  const f = game.funds.find(x => x.id === fundId);
  if (f) {
    f.card = card;
    f.cardTurns = CARD_TURNS;
    const label = card === 'hong' ? '红卡' : '黑卡';
    addLog(`${f.name} 触发【${label}】！接下来 ${CARD_TURNS} 回合每回合 ${card === 'hong' ? '+' : '-'}20%`, card === 'hong' ? 'good' : 'bad');
  }
}

function pickFundForCard(g, p, type) {
  // 红卡/黑卡：先指定目标基金，再触发行情
  const label = type === 'hong' ? '红卡' : '黑卡';
  const pct = type === 'hong' ? '+20%' : '-20%';
  if (p.isAI) {
    // AI 策略：红卡 → 自己持仓市值最大的基金；黑卡 → 对手持仓市值最大的基金
    let target = null, best = -1;
    if (type === 'hong') {
      g.funds.forEach(f => {
        const v = (p.funds[f.id] || 0) * f.price;
        if (v > best) { best = v; target = f; }
      });
    } else {
      g.funds.forEach(f => {
        let total = 0;
        g.players.forEach(op => { if (op !== p && !op.bankrupt) total += (op.funds[f.id] || 0) * f.price; });
        if (total > best) { best = total; target = f; }
      });
    }
    if (!target) target = g.funds[randInt(0, g.funds.length - 1)];
    triggerFundCard(target.id, type);
    return;
  }
  // 真人：弹窗选择目标基金
  let html = `<h2>${label} · 选择目标基金</h2>`;
  html += `<div class="modal-desc">对哪只基金触发${label}行情？未来 ${CARD_TURNS} 回合每回合 ${pct}。</div>`;
  html += '<div class="fund-pick-list">';
  g.funds.forEach(f => {
    html += `
      <div class="fund-pick-item" data-fund="${f.id}">
        <div class="fp-name" style="color:${f.color}">${f.name}</div>
        <div class="fp-price">当前 ¥${f.price.toFixed(1)}</div>
      </div>
    `;
  });
  html += '</div>';
  showModal(html);
  document.querySelectorAll('.fund-pick-item').forEach(el => {
    el.onclick = () => {
      triggerFundCard(el.dataset.fund, type);
      closeModal();
      renderAll();
    };
  });
}

function updateFundPrices() {
  game.funds.forEach(f => {
    // 1) 先处理已触发的保底/封顶保护机制
    if (f.guard === 'up') {
      // 跌破 50 救市：每回合 +20%，直到 >=5000 恢复
      f.price = Math.max(1, f.price * 1.2);
      f.history.push(f.price);
      if (f.history.length > 60) f.history.shift();
      if (f.price >= 5000) {
        f.guard = null;
        addLog(`${f.name} 回升到 5000 以上，救市结束，恢复正常波动。`, 'good');
      }
      return;
    }
    if (f.guard === 'down') {
      // 突破 10000 回调：每回合 -20%，直到 <=60 恢复
      f.price = Math.max(1, f.price * 0.8);
      f.history.push(f.price);
      if (f.history.length > 60) f.history.shift();
      if (f.price <= 60) {
        f.guard = null;
        addLog(`${f.name} 回落到 60 以下，回调结束，恢复正常波动。`, 'bad');
      }
      return;
    }

    // 2) 正常波动 + 红黑卡状态机
    let change;
    if (f.card && f.cardTurns > 0) {
      // 处于红卡/黑卡状态：本回合固定 ±20%
      change = f.card === 'hong' ? CARD_PCT : -CARD_PCT;
    } else {
      // 正常波动，并尝试触发新状态
      change = normalChangeFor(f);
      if (maybeTriggerCard(f)) {
        // 触发成功：本回合直接进入 ±20%
        change = f.card === 'hong' ? CARD_PCT : -CARD_PCT;
      }
    }

    // 扣减持续回合数，状态结束恢复常态
    if (f.card && f.cardTurns > 0) {
      f.cardTurns--;
      if (f.cardTurns <= 0) {
        f.card = null;
        f.cardTurns = 0;
        addLog(`${f.name} 异动结束，恢复平稳波动。`, 'info');
      }
    }

    f.price = Math.max(1, f.price * (1 + change));
    f.history.push(f.price);
    if (f.history.length > 60) f.history.shift();

    // 3) 检查是否触发保底/封顶机制
    if (f.price < 50) {
      f.guard = 'up';
      f.card = null;
      f.cardTurns = 0;
      addLog(`${f.name} 跌破 50，触发救市！每回合 +20%，直到 5000。`, 'good');
    } else if (f.price > 10000) {
      f.guard = 'down';
      f.card = null;
      f.cardTurns = 0;
      addLog(`${f.name} 突破 10000，触发回调！每回合 -20%，直到 60。`, 'bad');
    }
  });
}

function forceFundChange(fundId, changePct) {
  const f = game.funds.find(x => x.id === fundId);
  if (f) {
    f.price = Math.max(1, f.price * (1 + changePct));
    f.history.push(f.price);
    if (f.history.length > 60) f.history.shift();
  }
}

// ---------- 玩家移动 ----------
function movePlayer(p, steps, isCardMove = false) {
  const oldPos = p.position;
  p.position = (p.position + steps + 24) % 24;

  // 经过起点（工资半指数化：物价涨得比工资快，高资产时代价更高）
  if (!isCardMove && steps > 0 && p.position < oldPos) {
    const idx = getPriceIndex();
    const bonus = Math.round(PASS_GO_BONUS * (1 + (idx - 1) * 0.5));
    p.cash += bonus;
    addLog(`经过起点，获得 ¥${fmt(bonus)}！`, 'good', p.name);
  }

  renderBoard();
  renderCurrentPlayer();
}

function splitTotal(total) {
  // 把 2~12 的步数拆成两个 1~6 的骰子点数
  let d1, d2;
  if (total <= 7) { d1 = randInt(1, Math.min(6, total - 1)); d2 = total - d1; }
  else { d1 = randInt(total - 6, 6); d2 = total - d1; }
  return [d1, d2];
}

function aiRemoteTarget(p) {
  // AI 遥控骰子策略：选对自己最有利的步数
  let best = randInt(2, 6);
  let bestScore = -Infinity;
  for (let s = 1; s <= 12; s++) {
    const pos = (p.position + s) % 24;
    const cell = game.board[pos];
    let score = 0;
    if (cell.type === 'property') {
      if (cell.owner === null) score = (cell.super ? 2600 : cell.price) * 0.6;
      else if (cell.owner === p.id) score = 300 + (cell.houses || 0) * 250;
      else score = -(cell.rent * (1 + (cell.houses || 0) * 1.5));
    } else if (cell.type === 'start') score = 2000;
    else if (cell.type === 'card') score = 120;
    else if (cell.type === 'fortune') score = 0;  // 占卜屋吉凶难测
    if (score > bestScore) { bestScore = score; best = s; }
  }
  return best;
}

function showRemoteDiceModal(p, callback) {
  showModal(`
    <h2>遥控骰子</h2>
    <div class="modal-desc">自由指定本次前进步数（2~12）</div>
    <div class="remote-pick">
      ${Array.from({ length: 11 }, (_, i) => `<button class="btn btn-secondary remote-num" data-n="${i + 2}">${i + 2}</button>`).join('')}
    </div>
  `);
  document.querySelectorAll('.remote-num').forEach(btn => {
    btn.onclick = () => {
      const n = parseInt(btn.dataset.n);
      closeModal();
      callback(n);
    };
  });
}

// ---------- 掷骰子 ----------
function rollDice() {
  const p = game.players[game.currentPlayerIndex];

  // 遥控骰子：自由指定前进步数
  if (p.remoteDice) {
    p.remoteDice = false;
    addLog(`${p.name} 启用遥控骰子，可自由指定步数。`, 'good', p.name);
    const applyRemote = (total) => {
      const [d1, d2] = splitTotal(total);
      game.dice = [d1, d2];
      game.doublesPending = (d1 === d2); // 遥控拆出双数也可再掷
      renderDice();
      $('die1').classList.add('rolling');
      $('die2').classList.add('rolling');
      $('roll-btn').disabled = true;
      setTimeout(() => {
        $('die1').classList.remove('rolling');
        $('die2').classList.remove('rolling');
        renderDice();
        addLog(`遥控骰子：前进 ${total} 步`, 'good', p.name);
        game.cardMoveDepth = 0;
        movePlayer(p, total);
        setTimeout(() => { handleLanding(); }, 150);
      }, 300);
    };
    if (p.isAI) {
      applyRemote(aiRemoteTarget(p));
    } else {
      showRemoteDiceModal(p, applyRemote);
    }
    return;
  }

  // 正常掷骰
  const d1 = randInt(1, 6);
  const d2 = randInt(1, 6);
  game.dice = [d1, d2];
  game.doublesPending = (d1 === d2); // 双数可再掷一次

  // 动画
  $('die1').classList.add('rolling');
  $('die2').classList.add('rolling');
  $('roll-btn').disabled = true;

  setTimeout(() => {
    $('die1').classList.remove('rolling');
    $('die2').classList.remove('rolling');
    renderDice();

    const total = d1 + d2;
    addLog(`掷出 ${d1} + ${d2} = ${total}`, 'info', p.name);

    // 移动
    game.cardMoveDepth = 0;
    movePlayer(p, total);

    setTimeout(() => {
      handleLanding();
    }, 150);
  }, 300);
}

// ---------- 落地处理 ----------
function handleLanding() {
  const p = game.players[game.currentPlayerIndex];
  const cell = game.board[p.position];

  switch (cell.type) {
    case 'start':
      addLog('到达起点。', 'info', p.name);
      game.phase = 'action';
      renderActions();
      if (p.isAI) scheduleAITurn();
      else if (!p.bankrupt && !game.doublesPending) endTurn();  // 自动进入下一回合
      break;

    case 'property':
      handlePropertyLanding(p, cell);
      break;

    case 'card':
      handleCardShop(p);
      break;

    case 'fortune':
      {
        const idx = getPriceIndex();
        const good = Math.random() < 0.5;
        const pool = good ? FORTUNE_GOOD : FORTUNE_BAD;
        const ev = pool[randInt(0, pool.length - 1)];
        addLog(`🔮 占卜屋（${good ? '上上签' : '下下签'}）：${ev.title} — ${ev.text}`, good ? 'good' : 'bad', p.name);
        ev.effect(game, p, idx);
        if (p.cash < 0) checkBankruptcy(p);
        game.phase = 'action';
        renderActions();
        renderCurrentPlayer();
        if (p.isAI) scheduleAITurn();
        else if (!p.bankrupt && !game.doublesPending) endTurn();  // 自动进入下一回合
      }
      break;

  }

  renderCurrentPlayer();
  renderPlayerList();
  // 破产玩家自动跳过，交给下一个活着的玩家
  if (p.bankrupt && game.phase !== 'ended') maybeSkipBankruptCurrent();
}

function handlePropertyLanding(p, cell) {
  if (cell.owner === null) {
    // 无主土地
    if (p.isAI) {
      if (aiShouldBuy(p, cell)) {
        buyProperty(p, cell);
      } else {
        addLog(`${p.name} 放弃购买「${cell.name}」。`, 'info', p.name);
      }
      game.phase = 'action';
      renderAll();
      scheduleAITurn();
    } else {
      showBuyPropertyModal(p, cell);
    }
  } else if (cell.owner === p.id) {
    // 自己的土地 - 可以盖房
    addLog(`回到自己的土地「${cell.name}」。`, 'info', p.name);
    if (cell.houses < MAX_HOUSES && p.cash >= cell.houseCost) {
      if (p.isAI) {
        if (aiShouldBuild(p, cell)) {
          buildHouse(p, cell);
        } else {
          addLog(`${p.name} 暂不盖房，保留现金流。`, 'info', p.name);
        }
        game.phase = 'action';
        renderAll();
        scheduleAITurn();
      } else {
        showHouseModal(p, cell);
      }
    } else {
      game.phase = 'action';
      renderActions();
      if (p.isAI) scheduleAITurn();
      else if (!p.bankrupt && !game.doublesPending) endTurn();  // 自动进入下一回合
    }
  } else {
    // 别人的土地 - 付过路费
    const owner = game.players[cell.owner];
    if (!owner.bankrupt && !cell.mortgaged) {
      const rent = calcRent(cell);
      p.cash -= rent;
      owner.cash += rent;
      const houseText = cell.houses > 0 ? `（${cell.houses}栋房）` : '';
      addLog(`在「${cell.name}」${houseText}向 ${owner.name} 支付过路费 ¥${fmt(rent)}。`, 'bad', p.name);
      checkBankruptcy(p);
    } else {
      addLog(`「${cell.name}」已抵押，无需支付过路费。`, 'info', p.name);
    }
    game.phase = 'action';
    renderActions();
    renderCurrentPlayer();
    renderPlayerList();
    if (p.isAI) scheduleAITurn();
    else if (!p.bankrupt && !game.doublesPending) endTurn();  // 自动进入下一回合
  }
}

// ---------- 土地/盖房动作（真人弹窗与 AI 共用） ----------
function buyProperty(p, cell) {
  const cost = Math.max(1, Math.round(cell.price * getPriceIndex()));
  p.cash -= cost;
  cell.owner = p.id;
  p.properties.push(cell.id);
  addLog(`购买了「${cell.name}」，花费 ¥${fmt(cost)}。`, 'good', p.name);
}

function buildHouse(p, cell) {
  const cost = Math.max(1, Math.round(cell.houseCost * getPriceIndex()));
  p.cash -= cost;
  cell.houses++;
  addLog(`在「${cell.name}」盖了一栋房（共${cell.houses}栋），花费 ¥${fmt(cost)}。`, 'good', p.name);
}

// ---------- AI 决策 ----------
const AI_STEP_DELAY = 600;

function scheduleAITurn() {
  const p = game.players[game.currentPlayerIndex];
  if (!p || game.phase === 'ended') return;
  // 当前玩家破产：跳过其回合，推进到下一个活着的玩家
  if (p.bankrupt) {
    maybeSkipBankruptCurrent();
    return;
  }
  if (!p.isAI) return;
  // 若有模态框打开（游戏结束等），不调度
  if ($('modal-overlay').classList.contains('active')) return;
  setTimeout(() => {
    const cur = game.players[game.currentPlayerIndex];
    if (!cur || game.phase === 'ended') return;
    if (cur.bankrupt) { maybeSkipBankruptCurrent(); return; }
    if (!cur.isAI) return;
    if ($('modal-overlay').classList.contains('active')) return;
    if (game.phase === 'idle') {
      // AI 每回合开始先主动用卡、基金交易，再掷骰（卡片只在卡片屋购买）
      aiMaybeUseCard(cur);
      checkBankruptcy(cur);
      aiTradeFunds(cur);
      checkBankruptcy(cur);
      renderAll();
      if (game.phase === 'ended') return;
      setTimeout(() => {
        const cur2 = game.players[game.currentPlayerIndex];
        if (!cur2 || game.phase === 'ended') return;
        if (cur2.bankrupt) { maybeSkipBankruptCurrent(); return; }
        if (!cur2.isAI) return;
        if ($('modal-overlay').classList.contains('active')) return;
        rollDice();
      }, 400);
    } else if (game.phase === 'action') {
      aiResolveAction();
    }
  }, AI_STEP_DELAY);
}

function aiResolveAction() {
  const p = game.players[game.currentPlayerIndex];
  if (p.isAI) {
    endTurn();
  }
}

function aiShouldBuy(p, cell) {
  const price = Math.max(1, Math.round(cell.price * getPriceIndex()));
  if (p.cash < price) return false;
  const total = Math.max(1, calcTotalAssets(p));
  const cashAfter = p.cash - price;
  const ratio = cashAfter / total;
  // 街道策略：优先凑齐全街（全街租金翻倍）
  const street = STREET_OF[cell.id];
  let streetBonus = 1;
  if (street) {
    const owned = street.cells.filter(cid => game.board[cid].owner === p.id).length;
    const missing = street.cells.length - owned;
    if (missing === 1 && owned >= 1) streetBonus = 3;   // 差一块凑齐全街：重金必买
    else if (missing === 2 && owned >= 1) streetBonus = 1.7;
  }
  const want = ratio * streetBonus;
  if (want > 0.20) return Math.random() < 0.95;  // 现金充裕/凑街，几乎必买
  if (want > 0.08) return Math.random() < 0.65;
  return Math.random() < 0.3;
}

function aiShouldBuild(p, cell) {
  if (cell.houses >= MAX_HOUSES) return false;
  const cost = Math.max(1, Math.round(cell.houseCost * getPriceIndex()));
  const total = Math.max(1, calcTotalAssets(p));
  const ratio = (p.cash - cost) / total;
  // 全街地产租金翻倍，AI 更积极盖房
  const street = STREET_OF[cell.id];
  const ownsFull = street && ownsWholeStreet(p.id, street);
  if (ownsFull) {
    if (cell.houses === 0) return p.cash >= cost * 1.1;
    return ratio > 0.04;   // 全街：持续盖房升级
  }
  if (cell.houses === 0) return p.cash >= cost * 1.5;
  return ratio > 0.15;
}

function aiTradeFunds(p) {
  const actions = [];
  game.funds.forEach(f => {
    const held = p.funds[f.id] || 0;
    const last = f.price;
    const prev = f.history.length > 1 ? f.history[f.history.length - 2] : f.price;
    const change = prev > 0 ? (last - prev) / prev : 0;

    // 红卡/黑卡异动状态：趋势跟随
    if (f.card === 'hong' && f.cardTurns > 0) {
      // 红卡：上涨趋势，重仓追涨
      if (p.cash > f.price * 3) {
        const buyAmt = 3;
        p.cash -= buyAmt * f.price;
        p.funds[f.id] = (p.funds[f.id] || 0) + buyAmt;
        actions.push(`红卡加仓 ${f.short} ${buyAmt}份`);
      }
      return;
    }
    if (f.card === 'hei' && f.cardTurns > 0) {
      // 黑卡：下跌趋势，清仓避险
      if (held > 0) {
        p.cash += held * f.price;
        p.funds[f.id] = 0;
        actions.push(`黑卡清仓 ${f.short} ${held}份`);
      }
      return;
    }

    if (f.behavior === 'steady_up') {
      // 满分躺赢基金：稳定上涨，积极建仓并长期持有，涨超35%止盈一半
      if (held < 3 && p.cash > f.price * 3) {
        const buyAmt = held === 0 ? 2 : 1;
        p.cash -= buyAmt * f.price;
        p.funds[f.id] = (p.funds[f.id] || 0) + buyAmt;
        actions.push(`加仓买入 ${f.short} ${buyAmt}份`);
      } else if (held > 0 && f.price >= f.basePrice * 1.35) {
        const sellAmt = Math.max(1, Math.floor(held / 2));
        p.cash += sellAmt * f.price;
        p.funds[f.id] -= sellAmt;
        actions.push(`止盈卖出 ${f.short} ${sellAmt}份`);
      }
    } else if (f.behavior === 'volatile') {
      // 考试蹦极基金：大起大落，高抛低吸
      if (change < -0.05 && p.cash > f.price * 3) {
        const buyAmt = 3;
        p.cash -= buyAmt * f.price;
        p.funds[f.id] = (p.funds[f.id] || 0) + buyAmt;
        actions.push(`低吸买入 ${f.short} ${buyAmt}份`);
      } else if (change > 0.05 && held > 0) {
        const sellAmt = held >= 2 ? 2 : 1;
        p.cash += sellAmt * f.price;
        p.funds[f.id] -= sellAmt;
        actions.push(`高抛卖出 ${f.short} ${sellAmt}份`);
      }
    } else if (f.behavior === 'random_high') {
      // 顶流塌房基金：大跌抄底、大涨止盈
      if (change < -0.06 && p.cash > f.price * 10) {
        p.cash -= f.price;
        p.funds[f.id] = (p.funds[f.id] || 0) + 1;
        actions.push(`抄底买入 ${f.short} 1份`);
      } else if (change > 0.08 && held > 0) {
        p.cash += f.price;
        p.funds[f.id]--;
        actions.push(`止盈卖出 ${f.short} 1份`);
      }
    }
    // 锦鲤盲盒基金：随机波动，AI 不主动交易
  });
  if (actions.length > 0) {
    addLog(`${p.name} 基金操作：${actions.join('，')}`, 'info', p.name);
  }
}

function aiMaybeUseCard(p) {
  // AI 行动前决定是否使用手牌：脚下有可夺土地时必用购地卡，其余约 60% 随机用一张
  if (!p || p.bankrupt || p.cards.length === 0) return false;
  const cell = game.board[p.position];
  const landIdx = p.cards.findIndex(c => c.title === '购地卡' && cell && cell.type === 'property' && cell.owner !== p.id);
  if (landIdx !== -1) {
    const card = p.cards[landIdx];
    p.cards.splice(landIdx, 1);
    const ok = card.effect(game, p);
    if (ok !== false) {
      addLog(`${p.name} 使用卡片【${card.title}】：${card.text}`, card.type, p.name);
      checkBankruptcy(p);
      return true;
    }
    p.cards.splice(landIdx, 0, card);
    return false;
  }
  // 怪兽卡：对手有房屋时优先使用，破坏其地产
  const alivePlayers = game.players.filter(op => !op.bankrupt);
  const oppHouses = alivePlayers.some(op => op !== p && op.properties.some(pid => (game.board[pid].houses || 0) > 0));
  if (oppHouses) {
    const mIdx = p.cards.findIndex(c => c.title === '怪兽卡');
    if (mIdx !== -1) {
      const card = p.cards[mIdx];
      p.cards.splice(mIdx, 1);
      const ok = card.effect(game, p);
      if (ok !== false) {
        addLog(`${p.name} 使用卡片【${card.title}】：${card.text}`, card.type, p.name);
        checkBankruptcy(p);
        return true;
      }
      p.cards.splice(mIdx, 0, card);
    }
  }
  if (Math.random() < 0.6) {
    const idx = randInt(0, p.cards.length - 1);
    const card = p.cards[idx];
    p.cards.splice(idx, 1);
    const ok = card.effect(game, p);
    if (ok === false) {
      p.cards.splice(Math.min(idx, p.cards.length), 0, card);
      addLog(`【${card.title}】不满足使用条件，卡片保留。`, 'info', p.name);
      return false;
    }
    addLog(`${p.name} 使用卡片【${card.title}】：${card.text}`, card.type, p.name);
    checkBankruptcy(p);
    return true;
  }
  return false;
}

function aiBuyFromShop(p) {
  // AI 商店购买策略：预算充足且手牌未满时，优先购买强卡（购地/怪兽/均富/遥控骰子）
  if (p.cards.length < 5 && p.cash > STARTING_MONEY * 0.6) {
    const afford = CARD_SHOP.filter(s => p.cash >= shopPrice(s));
    if (afford.length > 0) {
      const priority = ['购地卡', '怪兽卡', '红卡', '均富卡', '黑卡', '均贫卡', '遥控骰子', '免费土地', '免费盖房', '包租婆'];
      afford.sort((a, b) => {
        const pa = priority.indexOf(a.card.title);
        const pb = priority.indexOf(b.card.title);
        return (pa === -1 ? 99 : pa) - (pb === -1 ? 99 : pb);
      });
      const s = afford[0];
      p.cash -= shopPrice(s);
      p.cards.push(s.card);
      addLog(`${p.name} 在卡片商店购买了「${s.card.title}」，花费 ¥${fmt(shopPrice(s))}。`, 'good', p.name);
    }
  }
  game.phase = 'action';
  renderAll();
  scheduleAITurn();
}

// 滑动条档位→实际份数：最左=1份、最右=可买/可卖最大值，等距分布（步长不一定是1）
function sliderQty(v, maxQty, N) {
  if (maxQty <= 1) return 1;
  const steps = Math.max(N, 2);
  return Math.max(1, Math.round(1 + (v - 1) / (steps - 1) * (maxQty - 1)));
}

        const q = r ? sliderQty(parseInt(r.value) || 0, parseInt(r.dataset.max) || 1, parseInt(r.max) || 1) : 0;
        amount = -q;
      }
      else if (action === 'buyall') amount = Math.max(0, Math.floor(p.cash / f.price));
      else if (action === 'sellall') amount = -(p.funds[fundId] || 0);

      if (amount > 0) {
        const cost = amount * f.price;
        if (p.cash >= cost) {
          p.cash -= cost;
          p.funds[fundId] = (p.funds[fundId] || 0) + amount;
          addLog(`买入 ${f.name} ${amount}份，花费 ¥${fmt(cost)}。`, 'info', p.name);
        } else {
          addLog(`现金不足，无法买入 ${f.name}。`, 'bad', p.name);
        }
      } else if (amount < 0) {
        const sellAmount = Math.min(-amount, p.funds[fundId] || 0);
        if (sellAmount > 0) {
          const revenue = sellAmount * f.price;
          p.cash += revenue;
          p.funds[fundId] -= sellAmount;
          addLog(`卖出 ${f.name} ${sellAmount}份，获得 ¥${fmt(revenue)}。`, 'good', p.name);
        }
      }
      showFundModal(); // 刷新
      renderCurrentPlayer();
      renderPlayerList();
    };
  });

  $('fund-close').onclick = () => {
    closeModal();
  };

  // 基金交易页：点击页面外任意位置即可退出
  $('modal-overlay').dataset.dismiss = '1';
}

// ---------- 破产检查 ----------
function checkBankruptcy(p) {
  if (p.cash < 0 && !p.bankrupt) {
    // 尝试自动变卖资产
    const totalAssets = calcTotalAssets(p);
    if (totalAssets + p.cash < 0) {
      // 真破产
      p.bankrupt = true;
      p.bankruptOrder = game.bankruptSeq++;
      p.cards = [];
      p.cardAddedTurn = -1;
      // 土地归还
      p.properties.forEach(pid => {
        game.board[pid].owner = null;
        game.board[pid].houses = 0;
      });
      p.properties = [];
      // 基金清零
      Object.keys(p.funds).forEach(k => p.funds[k] = 0);
      addLog(`💀 ${p.name} 破产了！所有资产被清算。`, 'bad', p.name);

      // 检查游戏是否结束
      const alive = game.players.filter(pl => !pl.bankrupt);
      if (alive.length <= 1) {
        endGame(alive[0]);
        return;
      }
    } else {
      // 自动变卖基金和抵押房产来还债
      autoSellAssets(p, -p.cash);
    }
  }
}

function autoSellAssets(p, needed) {
  const idx = getPriceIndex(); // 统一物价快照，清算金额取整
  // 先卖基金
  game.funds.forEach(f => {
    if (needed <= 0) return;
    const held = p.funds[f.id] || 0;
    if (held > 0) {
      const sellAmount = Math.min(held, Math.ceil(needed / f.price));
      const revenue = sellAmount * f.price;
      p.cash += revenue;
      p.funds[f.id] -= sellAmount;
      needed -= revenue;
      addLog(`破产清算：卖出 ${f.name} ${sellAmount}份，获得 ¥${fmt(revenue)}。`, 'bad', p.name);
    }
  });
  // 再抵押房产
  if (needed > 0) {
    [...p.properties].forEach(pid => {
      if (needed <= 0) return;
      const cell = game.board[pid];
      // 卖房子
      while (cell.houses > 0 && needed > 0) {
        cell.houses--;
        const rev = Math.round(cell.houseCost * idx * 0.5);
        p.cash += rev;
        needed -= rev;
        addLog(`破产清算：在「${cell.name}」卖掉一栋房。`, 'bad', p.name);
      }
      // 抵押土地
      if (needed > 0) {
        cell.mortgaged = true;
        const rev = Math.round(cell.price * idx * 0.5);
        p.cash += rev;
        needed -= rev;
        addLog(`破产清算：抵押「${cell.name}」。`, 'bad', p.name);
      }
    });
  }
}

// ---------- 回合结束 ----------
function endTurn() {
  const p = game.players[game.currentPlayerIndex];

  // 双数：不结束回合，获得一次额外行动（可再掷）
  if (game.doublesPending) {
    game.doublesPending = false;
    if (!p.bankrupt && game.phase !== 'ended') {
      game.phase = 'idle';
      addLog(`${p.name} 掷出双数，获得额外行动，可再掷一次！`, 'good', p.name);
      renderAll();
      scheduleAITurn();
      return;
    }
  }

  // 更新基金价格
  updateFundPrices();

  // 下一个玩家
  let nextIdx = (game.currentPlayerIndex + 1) % game.players.length;
  let attempts = 0;
  while (game.players[nextIdx].bankrupt && attempts < game.players.length) {
    nextIdx = (nextIdx + 1) % game.players.length;
    attempts++;
  }

  if (nextIdx <= game.currentPlayerIndex) {
    game.turn++;
  }

  game.currentPlayerIndex = nextIdx;
  game.phase = 'idle';

  renderAll();

  // 若只剩 1 名玩家存活，直接判定获胜（避免剩余玩家无限循环）
  const aliveCount = game.players.filter(pl => !pl.bankrupt).length;
  if (aliveCount <= 1) {
    endGame(game.players[game.currentPlayerIndex]);
    return;
  }

  // 如果轮到 AI，自动开始其回合
  scheduleAITurn();
}

// ---------- 游戏结束 ----------
function endGame(winner) {
  game.phase = 'ended';
  // 按破产顺序排名：未破产者第一，破产者越晚破产排名越靠前
  const sorted = [...game.players].sort((a, b) => {
    const ao = a.bankrupt ? a.bankruptOrder : Number.MAX_SAFE_INTEGER;
    const bo = b.bankrupt ? b.bankruptOrder : Number.MAX_SAFE_INTEGER;
    return bo - ao;
  });
  let statsHtml = '';
  sorted.forEach((p, i) => {
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '　';
    const rankLabel = p.bankrupt ? `破产·第${p.bankruptOrder + 1}位` : '';
    statsHtml += `
      <div class="player-row" style="${p.bankrupt ? 'opacity:0.4;' : ''}">
        <span style="width:24px;">${medal}</span>
        <div class="pr-dot" style="background:${p.color}"></div>
        <div class="pr-name">${p.name}${p.isAI ? '<span class="ai-tag">AI</span>' : ''}${rankLabel ? `<span class="bankrupt-order">${rankLabel}</span>` : ''}</div>
        <div class="pr-money">¥${fmt(calcTotalAssets(p))}</div>
      </div>
    `;
  });

  showModal(`
    <div class="game-over-modal">
      <div class="trophy">🏆</div>
      <div class="winner-name">${winner.name} 获胜！</div>
      <div class="modal-desc">最终资产 ¥${fmt(calcTotalAssets(winner))}</div>
      <div class="final-stats">${statsHtml}</div>
      <button class="btn btn-primary" id="restart-btn" style="width:100%;">再来一局</button>
    </div>
  `);

  $('restart-btn').onclick = () => {
    closeModal();
    $('game-screen').classList.remove('active');
    $('start-screen').style.display = 'flex';
  };
}

function setupStartScreen() {
  $('rules-btn').onclick = showGameRules;
  // 渲染 7 个 IP 角色卡片（七选一）
  const grid = $('ip-grid');
  grid.innerHTML = '';
  // 正六边形布局：外圈 6 点等距（R=120），鼻嗨皮居中
  const IP_LAYOUT = [
    { id: 'donggaofen',  pos: 'pos-top-left' },
    { id: 'dongworui',   pos: 'pos-top-right' },
    { id: 'qinlianxi',   pos: 'pos-mid-left' },
    { id: 'bihaipi',     pos: 'pos-center' },
    { id: 'qinshihuang', pos: 'pos-mid-right' },
    { id: 'aigaicuo',    pos: 'pos-bottom-left' },
    { id: 'ailika',      pos: 'pos-bottom-right' },
  ];
  IP_LAYOUT.forEach(layout => {
    const c = IP_CHARS.find(x => x.id === layout.id);
    const card = document.createElement('div');
    card.className = 'ip-card ' + layout.pos + (c.id === selectedCharId ? ' active' : '');
    card.dataset.char = c.id;
    card.innerHTML = `
      <img class="ip-avatar" src="${c.avatar}" alt="${c.name}">
      <div class="ip-name">${c.name}</div>
      <div class="ip-tag">${c.tag}</div>
    `;
    card.onclick = () => {
      grid.querySelectorAll('.ip-card').forEach(x => x.classList.remove('active'));
      card.classList.add('active');
      selectedCharId = c.id;
    };
    grid.appendChild(card);
  });

  // 渲染玩家人数（2-7，除自己外均为 AI）
  const countRow = $('player-count-row');
  countRow.innerHTML = '';
  for (let n = 2; n <= 7; n++) {
    const btn = document.createElement('button');
    btn.className = 'count-btn' + (n === selectedPlayerCount ? ' active' : '');
    btn.dataset.count = n;
    btn.textContent = n;
    btn.onclick = () => {
      countRow.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedPlayerCount = n;
    };
    countRow.appendChild(btn);
  }

  $('start-btn').onclick = () => {
    const me = IP_CHARS.find(c => c.id === selectedCharId) || IP_CHARS[0];
    const others = IP_CHARS.filter(c => c.id !== me.id);
    // AI 角色从剩余角色中纯随机抽取，不固定顺序
    const aiChars = shuffleArr([...others]).slice(0, selectedPlayerCount - 1);
    const names = [me.name, ...aiChars.map(c => c.name)];
    const types = ['human', ...aiChars.map(() => 'ai')];
    const colors = [me.color, ...aiChars.map(c => c.color)];
    const avatars = [me.avatar, ...aiChars.map(c => c.avatar)];
    initGame(names, types, colors, avatars);
  };
}
